<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="800" height="520" rx="14" fill="#161a22"/>

  <!-- 1. System resolution -->
  <rect x="20" y="20" width="760" height="480" rx="10" fill="#262b36" stroke="#9aa4b2" stroke-width="2"/>
  <circle cx="44" cy="44" r="12" fill="#9aa4b2"/>
  <text x="44" y="49" text-anchor="middle" font-size="14" font-weight="700" fill="#161a22">1</text>
  <text x="64" y="50" font-size="18" font-weight="700" fill="#e8ecf2">System resolution</text>
  <text x="242" y="50" font-size="14" fill="#b8c0cc">the screen: SteamOS / Windows / macOS display, e.g. 1280x800 (16:10)</text>

  <!-- 2. Mod -->
  <rect x="50" y="76" width="700" height="400" rx="8" fill="#1d3a2c" stroke="#4cc38a" stroke-width="2"/>
  <circle cx="74" cy="100" r="12" fill="#4cc38a"/>
  <text x="74" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#161a22">2</text>
  <text x="94" y="106" font-size="18" font-weight="700" fill="#e8ecf2">Mod</text>
  <text x="144" y="106" font-size="14" fill="#b8dcc8">Width / Height in its INI: same size as the screen</text>

  <!-- Original 16:9 view inside the mod's full-screen render -->
  <rect x="200" y="160" width="400" height="225" rx="4" fill="#2b2a1e" stroke="#f0b44c" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="400" y="278" text-anchor="middle" font-size="17" font-weight="700" fill="#f6d28f">original 16:9 view</text>

  <text x="125" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#b8dcc8">Ultrawide screens</text>
  <text x="125" y="280" text-anchor="middle" font-size="14" fill="#b8dcc8">more scene</text>
  <text x="125" y="298" text-anchor="middle" font-size="14" fill="#b8dcc8">rendered</text>
  <text x="400" y="424" text-anchor="middle" font-size="14" fill="#b8dcc8"><tspan font-weight="700">Taller screens</tspan>: more scene rendered</text>
</svg>
