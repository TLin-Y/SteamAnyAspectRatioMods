;;;;;;;;;; Ultrawide/Narrower ;;;;;;;;;;

[Fix Resolution]
; Allows the use of any resolution/aspect ratio.
Enabled = true

[Fix FOV]
; Fixes cropped FOV at <16:9 resolutions.
Enabled = true

[Adjust HUD Size]
; WIP: Adjust HUD size to 16:9.
; Note that this feature is a work-in-progress and does not adjust every part of the HUD to be 16:9.
Enabled = false

;;;;;;;;;; General ;;;;;;;;;;

[Disable Letterboxing]
; Disables letterboxing that appears in cutscenes and events.
Enabled = false

[Disable Character Dithering]
; Disables dithering of character models when the camera gets close.
Enabled = false