# Builds the desktop app on each OS (PyInstaller cannot cross-build) and attaches it to a published release.
name: Desktop app

on:
  workflow_dispatch:
  push:
    branches: [desktop]
    paths: [AnyAspectRatioDesktop/**, AnyAspectRatioDecky/**, .github/workflows/desktop.yml]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: the oldest glibc still on GitHub runners, so the Linux build runs on more distros.
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Qt's system libraries (copied into the Linux app)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libasound2 libatomic1 xvfb
      - run: python -m pip install -r AnyAspectRatioDesktop/requirements.txt
      - name: Tests
        working-directory: AnyAspectRatioDesktop
        run: python -m unittest discover -s test
      - name: Build and self-test
        shell: bash
        # The self-test opens a hidden window; Linux runners need a virtual display for it.
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} python AnyAspectRatioDesktop/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: AnyAspectRatioDesktop/build/release/*
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" AnyAspectRatioDesktop/build/release/* --clobber
