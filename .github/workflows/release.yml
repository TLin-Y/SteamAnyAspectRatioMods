# Builds every release file. A version tag also creates a draft release; a manual run only builds.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  plugin:
    runs-on: windows-latest
    steps:
      # The catalog checksums are of the files as stored in the repository.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python -c "import json; print(json.load(open('AnyAspectRatioDecky/plugin.json', encoding='utf-8'))['version'])")
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$version" ]; then
            echo "Tag $REF_NAME does not match plugin version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Tests and frontend
        working-directory: AnyAspectRatioDecky
        shell: bash
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          python scripts/update_catalog_hashes.py --check
          python -m unittest discover -s test
          pnpm run test:frontend
          pnpm run typecheck
          pnpm run build
      - name: Plugin zip and offline mods pack
        working-directory: AnyAspectRatioDecky
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          pwsh -File scripts/package-smoke.ps1 -Version "$VERSION"
          python scripts/build_offline_pack.py "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-plugin
          path: AnyAspectRatioDecky/out/*.zip
          if-no-files-found: error
          compression-level: 0

  desktop:
    strategy:
      fail-fast: false
      matrix:
        # PyInstaller cannot cross-build. ubuntu-22.04: the oldest glibc still on GitHub runners, so the
        # Linux build runs on more distros.
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Qt's system libraries (copied into the Linux app)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libasound2 libatomic1 xvfb
      - run: python -m pip install -r AnyAspectRatioDesktop/requirements.txt
      - name: Tests
        working-directory: AnyAspectRatioDesktop
        run: python -m unittest discover -s test
      - name: Build and self-test
        shell: bash
        # The self-test opens a hidden window; Linux runners need a virtual display for it.
        run: ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }} python AnyAspectRatioDesktop/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-desktop-${{ runner.os }}
          path: AnyAspectRatioDesktop/build/release/*
          if-no-files-found: error

  draft:
    if: github.ref_type == 'tag'
    needs: [plugin, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: files
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l files
          gh release create "$TAG" files/* --draft --verify-tag \
            --title "AnyAspectRatio $TAG" --notes-file .github/release-notes.md
